title: Image Communication on Short Waves
author: Martin Bruchanov OK2MNM
description: SSTV Handbook - Image Communication on Short Waves
baseurl: "/sstv-handbook"
url: ""

markdown: kramdown
kramdown:
  auto_ids: true
  toc_levels: 2..4

# Use custom layouts (no external theme needed)
# All layouts are in _layouts/ directory

# Collection: each chapter is a single .md in _chapters/ with front matter:
#   chapter_slug: "xxx"   (matches _data/chapters.yml)
# Content is pulled via {% include %} from _includes/
collections:
  chapters:
    output: true
    permalink: /chapters/:name/

defaults:
  - scope:
      path: "_chapters"
    values:
      layout: chapter

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - sstv-handbook-full.md
  - sstv-handbook.html
  - sstv-handbook.xml
  - convert_to_md.py
  - "*.bat"
  - Makefile
  - "*.ctex"
  - copy_rxsat
  - ch0*.md
  - toc.md
