<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Communication on Short Waves &ndash; SSTV Handbook</title>
  <meta name="description" content="SSTV Handbook by Martin Bruchanov OK2MNM">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />
  <link href="https://cdn.jsdelivr.net/npm/computer-modern@0.1.3/cmu-serif.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />
  <style>
    body {
      font-family: "CMU Serif", serif;
    }

    .sidebar {
      font-family: "CMU Serif", serif;
    }

    section.content {
      font-family: "CMU Serif", serif;
      font-size: 1rem;
      color: initial;
    }
  </style>
  <style>
    /* figure */

    .figure-combo {
      width: 75%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1rem auto;
      text-align: center;
    }

    .figure-combo>img {
      width: 100%;
      /* max-height: 18rem; */
      object-fit: contain;
    }

    .figure-item {
      width: 18rem;
    }

    .figure-wrapper {
      width: 100%;
      display: flex;
      align-items: flex-end;
    }

    .figure-wrapper>img {
      width: 100%;
      max-height: 18rem;
    }

    .figure-wrapper+div {
      margin-top: 0.5rem;
    }

    /* math block */

    .math-block {
      text-align: center;
      margin: 1rem 0;
    }

    /* table */

    table {
      margin: 0 !important;
      line-height: 1;
    }

    th,
    td {
      border: 1px solid #ddd !important;
    }

    th {
      text-align: center !important;
    }

    table .desc {
      text-align: left;
    }

    td pre {
      display: inline;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    let gitDatePromise = null;

    const fetchGitDate = () => {
      if (!gitDatePromise) {
        gitDatePromise = fetch("https://api.github.com/repos/kqakqakqa/sstv-handbook/commits/master")
          .then(res => res.json())
          .then(data => {
            const dateObj = new Date(data.commit.committer.date);
            return dateObj.toLocaleDateString("en-US", {
              year: "numeric",
              month: "long",
              day: "numeric"
            });
          });
      }
      return gitDatePromise;
    };

    window.$docsify = {
      name: "SSTV Handbook",
      repo: "",
      basePath: "",
      homepage: "index.md",
      loadSidebar: "_sidebar.md",
      loadNavbar: "_navbar.md",
      subMaxLevel: 3,
      auto2top: true,
      search: "auto",
      mergeNavbar: true,
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content, next) {
            if (content.includes("{{GIT_DATE}}")) {
              fetchGitDate().then(date => {
                next(content.replace("{{GIT_DATE}}", date));
              });
            } else {
              next(content);
            }
          });
          hook.doneEach(function () {
            addChapterNav();
          });
        }
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
</body>

</html>
